    name: Dubai Showroom                # fake branch (placeholder)
    timezone: Asia/Dubai
    working_hours:
      mon: ["09:00", "19:00"]
      tue: ["09:00", "19:00"]
      wed: ["09:00", "19:00"]
      thu: ["09:00", "19:00"]
      fri: ["14:00", "19:00"]
