# ---- Test drives (TO CONFIRM WITH SALES: all values are placeholders) ----
test_drive:
  slot_minutes: 30
  min_lead_minutes: 60            # PLACEHOLDER
  horizon_days: 14                # PLACEHOLDER
  licence_required: true          # mention at booking
  collect_fields: [name, phone]   # name and phone only

# ---- Negotiation (PLACEHOLDERS: TO BE SET BY THE BUSINESS) ---------------
# floor_price lives on each car; tiers are only the default when a car has none.
# The LLM never sees these numbers and never decides a price.
negotiation:
  max_rounds: 3
  counter_steps: 3                # concede in steps toward the auto-accept price; never jump, never reach the floor
  implausible_low_pct: 30         # offers below 30% / above 150% of list are re-confirmed as probably misheard
  implausible_high_pct: 150
  tiers:                          # by list price in AED, matched in order
    - { up_to: 50000,  max_discount_pct: 5.0, auto_accept_pct: 2.0 }
    - { up_to: 150000, max_discount_pct: 5.0, auto_accept_pct: 2.0 }
    - { up_to: null,   max_discount_pct: 4.0, auto_accept_pct: 1.5 }
  # Offers above auto_accept but within max_discount need manager approval.
  # Offers below the floor always escalate to a human.

# ---- Messaging channel (mocked) ------------------------------------------
send_details:
  default_channel: whatsapp
  mock: true

# ---- Reply wording ------------------------------------------------------
dialogue:
  variants: true          # true: use the human-approved wording variants in config/phrase_variants.yaml; false: base wording only
  draft: true             # the model rewrites SHORT replies whole (car-info answers, "nothing matches"); verified, else the template
  lead_in: true           # hybrid replies: verified model-written lead-in before low-risk templated answers (false = templates only)
  variant_seed: 7         # same seed -> same wording choices in a call (reproducible demos)
