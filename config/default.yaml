# Default configuration. Override with VA__SECTION__KEY env vars or --config <file>.
# Everything marked PLACEHOLDER / TO CONFIRM WITH SALES is invented for development.

app:
  log_dir: logs
  model_dir: models
  currency: AED
  distance_unit: km
  agent_name: Wazir             # said in the greeting everywhere (voice demo and website)

# ---- Observability -------------------------------------------------------
latency_log:
  console: true
  jsonl_path: logs/latency.jsonl
  # PRIVACY: off by default. Logs never contain transcripts or phone numbers unless true.
  include_transcripts: false

# ---- Speech-to-text (swappable) -----------------------------------------
stt:
  backend: sherpa_onnx          # sherpa_onnx | moonshine | faster_whisper (chosen in Phase 0b)
  model: null                   # filled in after the spike
  language: en
  hotwords_file: config/hotwords.txt   # car makes/models, Arabic names and places

# ---- LLM / NLU backends (swappable; every fallback is one line away) -------------------------
# The LLM only returns the INTENT (grammar-constrained, ~6 tokens); slots are extracted by code.
# Voice path runs `backend`; the Phase 1 text core and the website chat run `text_backend`.
# If the active backend fails its health check, or a call errors / exceeds timeout_s, the next of
# `fallbacks` is used and a warning is logged.
llm:
  backend: openvino_gpu
  text_backend: ollama
  fallbacks: [openvino_cpu, ollama]
  think: false                  # Qwen3 thinking must stay off
  temperature: 0.0
  backends:
    # Primary: Qwen3 4B on the Arc iGPU. STT must NOT run on the iGPU (measured: sharing slows NLU 0.9 -> 1.6 s).
    openvino_gpu:
      runtime: openvino
      device: GPU
      model: Qwen3-4B-Instruct-2507-int4-ov-nocal   # our data-free int4 conversion of the 2507 checkpoint (T0: matches Ollama Q4_K_M)
      prompt_mode: auto                          # -> per-state prompt on GPU
      timeout_s: 6.0                             # warm calls take ~0.7 s; this only fires if the iGPU stalls
      batching: true                             # all callers served together (8 at once: first token 5.1 s -> 0.23 s; see nlu/ov_batching.py)
    openvino_gpu_8b:                              # bigger model for more natural replies (about half the speed of the 4B)
      runtime: openvino
      device: GPU
      model: Qwen3-8B-int4-ov
      prompt_mode: auto
      timeout_s: 12.0
      batching: true
    openvino_gpu_mistral:                         # Mistral-7B-Instruct-v0.3 (Apache-2.0), OpenVINO int4 build, owner's request to compare
      runtime: openvino
      device: GPU
      model: Mistral-7B-Instruct-v0.3-int4-ov
      prompt_mode: auto
      timeout_s: 12.0
      batching: true
    openvino_gpu_phi:                             # Phi-4-mini-instruct (MIT): the reply writer with the best latency / safety-check pass rate in our comparison
      runtime: openvino
      device: GPU
      model: Phi-4-mini-instruct-int4-ov
      prompt_mode: auto
      timeout_s: 12.0
    openvino_gpu_small:
      runtime: openvino
      device: GPU
      model: Qwen3-1.7B-int4-ov
    # No-iGPU fallback: do not pin thread counts; static prompt keeps the KV prefix cached.
    openvino_cpu:
      runtime: openvino
      device: CPU
      model: Qwen3-1.7B-int4-ov
      prompt_mode: auto                          # -> static prompt on CPU
      timeout_s: 12.0                            # generous: a cold CPU fallback must load + prefill (1.2 s on a cache miss)
    ollama:
      runtime: ollama
      model: "qwen3:4b-instruct-2507-q4_K_M"
      prompt_mode: auto                          # -> static prompt
      timeout_s: 20.0                            # generous for the same reason (cold model load)
    # Disabled dev-only stub (needs VOICE_AGENT_ALLOW_CLOUD=1; synthetic data only; name read from env, never hard-coded).
    cloud_stub:
      runtime: cloud_stub
      model: unused
      model_env: GEMINI_MODEL
      api_key_env: GEMINI_API_KEY

# ---- Text-to-speech (swappable) -----------------------------------------
tts:
  backend: piper                # piper | kokoro (chosen in Phase 0b)
  voice: joe                    # Piper voice folder (see voice/tts.py). OWNER CHOICE (23 Oct 2026): Joe, US male, CC0 (shippable). Was amy_medium (licence unconfirmed)
  speaker: 0                    # speaker id inside the voice (amy has one; libritts_r has 904)
  cache_dir: models/tts_cache   # pre-rendered fixed phrases

# ---- Turn handling -------------------------------------------------------
turn:
  vad: silero
  turn_detector: pipecat_smart_turn   # confirmed against current Pipecat docs in Phase 3
  fallback_silence_ms: 700

# ---- Branches (2 FAKE branches; the car determines the branch) -----------
