# 500 callers at once on Kubernetes. Apply after filling in the image tag (RELEASE_TAG), the database secret and the domain:
# Every image is pinned: a moving tag changes under you when a pod restarts. Upgrade vLLM deliberately, then re-run the capacity probe.
#   kubectl apply -f deploy/k8s/voice.yaml
# Sizing (confirm with scripts/capacity_probe.py and scripts/load_test.py on the real cluster):
#   workers  up to 16 calls each (fewer while their answers are slow) -> ~45 at 500 callers (the autoscaler keeps them ~70% full),
#            up to 72 for an 800-caller spike; start at 36; CPU nodes (3-4 cores, 6-8 GB each)
#   model    vLLM, 2+ GPU replicas (one can fail); requests are batched, ~10-20% of callers wait on it at any moment
#   stt      Whisper on a GPU, batched for every worker (OpenAI transcription API); workers then run no recognizer of their own
#   database managed PostgreSQL (bookings and stock)
#   state    managed Redis (the workers' load reports that the router reads, and the call snapshots kept a day); no persistence needed, a lost snapshot only means a
#            returning visitor starts a fresh conversation. The address in the secret below is a placeholder: use your managed Redis (scripts/run_cluster.py --redis runs the same on one machine)
---
apiVersion: v1
kind: Secret
metadata: { name: voice-db }
stringData:
  DATABASE_URL: postgresql://agmc:CHANGE-ME@postgres.internal:5432/agmc
  STATE_URL: redis://redis.internal:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: model-server }
spec:
  replicas: 2
  selector: { matchLabels: { app: model-server } }
  template:
    metadata: { labels: { app: model-server } }
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.31.0
          args: ["--model", "Qwen/Qwen3-14B-AWQ", "--enable-prefix-caching", "--max-num-seqs", "256", "--gpu-memory-utilization", "0.85"]
          ports: [{ containerPort: 8000 }]
          resources: { limits: { nvidia.com/gpu: 1 } }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10, failureThreshold: 60 }
---
apiVersion: v1
kind: Service
metadata: { name: model-server }
spec:
  selector: { app: model-server }
  ports: [{ port: 8000, targetPort: 8000 }]
---
# Speech recognition for every worker, batched on a GPU. 500 callers end ~5-10 turns a second between them; one GPU transcribes far more than
# that with large-v3-turbo. Any server with POST /v1/audio/transcriptions works (vLLM below; speaches / faster-whisper-server too): confirm the
# exact serving flags for the vLLM version you pin, then measure with scripts/capacity_probe.py.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: model-server }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: model-server }
  minReplicas: 2                                      # one can fail
  maxReplicas: 24                                     # a GPU each; raise with the callers (see ARCH_REVIEW section 110 for the sizing)
  metrics:
    # requests held per model server (running + queued): 64 is where the measured server stopped being linear in the simulation's terms (ASSUMED for the GPU: measure it with a load test on the real card)
    - type: External
      external: { metric: { name: model_requests_per_replica }, target: { type: Value, value: "64" } }
  behavior:
    scaleUp: { stabilizationWindowSeconds: 0, policies: [{ type: Percent, value: 100, periodSeconds: 60 }] }      # a new GPU pod loads the model for minutes: ask early
    scaleDown: { stabilizationWindowSeconds: 600, policies: [{ type: Pods, value: 1, periodSeconds: 300 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: stt-server }
spec:
  replicas: 2
  selector: { matchLabels: { app: stt-server } }
  template:
    metadata: { labels: { app: stt-server } }
    spec:
      containers:
        - name: whisper
          image: vllm/vllm-openai:v0.31.0
          args: ["--model", "openai/whisper-large-v3-turbo", "--gpu-memory-utilization", "0.5"]
          ports: [{ containerPort: 8000 }]
          resources: { limits: { nvidia.com/gpu: 1 } }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10, failureThreshold: 60 }
---
apiVersion: v1
kind: Service
metadata: { name: stt-server }
spec:
  selector: { app: stt-server }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: voice-worker }
spec:
  replicas: 36
  selector: { matchLabels: { app: voice-worker } }
  strategy: { rollingUpdate: { maxUnavailable: 2, maxSurge: 4 } }
  template:
    metadata:
      labels: { app: voice-worker }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8765", prometheus.io/path: /metrics }
    spec:
      # Calls in progress finish on a redeploy, up to 15 minutes. A call has no such limit of its own (voice.max_call_secs: 2 hours; a quiet one ends itself in about 15 s), so one still
      # running then is cut when the pod stops, and the page reconnects it to another worker with the conversation from Redis (about a second, the sentence being said is lost).
      # Raise this only if that is not acceptable: a longer grace keeps draining pods (and their cost) around longer.
      terminationGracePeriodSeconds: 900
      containers:
        - name: worker
          image: agmc/voice:RELEASE_TAG
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: voice-db, key: DATABASE_URL } } }
            - { name: STATE_URL, valueFrom: { secretKeyRef: { name: voice-db, key: STATE_URL } } }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: VA__VOICE__STT_URL, value: "http://stt-server:8000/v1" }        # recognition on the GPU service, not in the worker
            - { name: VA__VOICE__STT_REMOTE_MODEL, value: "openai/whisper-large-v3-turbo" }
            - { name: VA__VOICE__MODEL_ONLY, value: "false" }      # production: never a test mode (a short model turn is completed by code)
            # "The model writes every reply": uncomment. The governor then only measures (never code or prefix answers, never sheds a decision); the call cap turns callers away and
            # the model-server HPA below adds capacity. A model that is down still cannot answer: decide what the caller hears (the fixed line + end the call, or a refused call).
            # - { name: VA__DIALOGUE__QUALITY, value: "observe" }
            - { name: VA__DIALOGUE__DECISION_BACKEND, value: "gpu_server" }   # the tool decisions go to the same vLLM as the replies (--backend below); the default is the Intel-GPU model
          command: ["sh", "-c"]
          args: ["python -m dealer_core.server --agent --prefix --backend gpu_server --host 0.0.0.0 --port 8765 --max-calls 16
                  --worker-id $POD_NAME --public-url wss://voice.agmc.ae/w/$POD_IP/voice --origin https://www.agmc.ae"]
          ports: [{ containerPort: 8765 }]
          resources: { requests: { cpu: "3", memory: 6Gi }, limits: { cpu: "4", memory: 8Gi } }
          readinessProbe: { httpGet: { path: /health, port: 8765 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8765 }, periodSeconds: 15, failureThreshold: 4 }
          volumeMounts: [{ name: models, mountPath: /app/models, readOnly: true }]
      volumes: [{ name: models, persistentVolumeClaim: { claimName: speech-models } }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: voice-worker }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: voice-worker }
  minReplicas: 8
  maxReplicas: 72                                     # 800 callers / (16 calls x 70%); raise it for more (each worker: 3-4 cores, 6-8 GB)
  metrics:
    # Scale on DEMAND at 70% of the measured capacity: (calls in progress + callers the router just turned away) / the workers' caps.
    # Turned-away callers are invisible to the workers; caps shrink when replies get slow (server/admission.py). Rule: deploy/prometheus-adapter.yaml
    - type: External
      external: { metric: { name: voice_demand_ratio }, target: { type: Value, value: "0.7" } }
  behavior:
    scaleUp: { stabilizationWindowSeconds: 0, policies: [{ type: Percent, value: 100, periodSeconds: 15 }] }     # double at most every 15 s
    scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Pods, value: 2, periodSeconds: 60 }] }    # shrink slowly (calls last minutes)
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: voice-router }
spec:
  replicas: 2
  selector: { matchLabels: { app: voice-router } }
  template:
    metadata:
      labels: { app: voice-router }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8760", prometheus.io/path: /metrics }
    spec:
      containers:
        - name: router
          image: agmc/voice:RELEASE_TAG
          env: [{ name: STATE_URL, valueFrom: { secretKeyRef: { name: voice-db, key: STATE_URL } } }]
          command: ["python", "-m", "dealer_core.gateway", "--host", "0.0.0.0", "--port", "8760", "--origin", "https://www.agmc.ae"]
          ports: [{ containerPort: 8760 }]
          readinessProbe: { httpGet: { path: /health, port: 8760 } }
---
apiVersion: v1
kind: Service
metadata: { name: voice-router }
spec:
  selector: { app: voice-router }
  ports: [{ port: 80, targetPort: 8760 }]
# The ingress (not shown, depends on the cluster) serves https://voice.agmc.ae/assign -> voice-router, and
# wss://voice.agmc.ae/w/<pod-ip>/voice -> that pod's port 8765 (so a call stays on the worker the router chose).
