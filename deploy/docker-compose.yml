# The whole system on ONE GPU machine (a first deployment, or a staging box).
#   docker compose -f deploy/docker-compose.yml up -d --scale worker=6
# For 500 callers across several machines, use the Kubernetes files in deploy/k8s/ instead.
# Every image is pinned (a moving tag changes under you between two restarts). Our own image takes the release tag from VOICE_TAG
# (e.g. the git commit): VOICE_TAG=$(git rev-parse --short HEAD) docker compose ... up -d
services:
  postgres:                       # bookings, stock, call snapshots, worker registry
    image: postgres:16.15
    environment: { POSTGRES_PASSWORD: change-me, POSTGRES_DB: agmc }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 10 }

  model-server:                   # vLLM (Apache-2.0): every worker's model requests, batched, on the GPU
    image: vllm/vllm-openai:v0.31.0
    command: ["--model", "Qwen/Qwen3-14B-AWQ", "--enable-prefix-caching", "--max-num-seqs", "256", "--gpu-memory-utilization", "0.75"]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }
    volumes: [hf:/root/.cache/huggingface]
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8000/health"], interval: 10s, retries: 60 }

  stt-server:                     # Whisper for every worker, batched on the GPU (OpenAI transcription API); shares the GPU with the model here
    image: vllm/vllm-openai:v0.31.0
    command: ["--model", "openai/whisper-large-v3-turbo", "--gpu-memory-utilization", "0.1"]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }
    volumes: [hf:/root/.cache/huggingface]
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8000/health"], interval: 10s, retries: 60 }

  worker:                         # voice workers: scale with --scale worker=N (each ~16 calls)
    image: agmc/voice:${VOICE_TAG:?set VOICE_TAG to the release tag of the voice image}
    environment:
      DATABASE_URL: postgresql://postgres:change-me@postgres:5432/agmc
      STATE_URL: postgresql://postgres:change-me@postgres:5432/agmc
      VA__VOICE__STT_URL: http://stt-server:8000/v1
      VA__VOICE__STT_REMOTE_MODEL: openai/whisper-large-v3-turbo
      VA__DIALOGUE__DECISION_BACKEND: gpu_server   # the tool decisions go to the same vLLM as the replies (--backend below); the default is the Intel-GPU model
      VA__VOICE__MODEL_ONLY: "false"   # production: a turn the model leaves short is completed with the code's own facts and question (model_only is a test mode)
    command: ["sh", "-c", "python -m dealer_core.server --agent --prefix --backend gpu_server --host 0.0.0.0 --port 8765 --max-calls 16 --worker-id $$HOSTNAME --public-url ws://$$HOSTNAME:8765/voice --origin https://www.agmc.ae"]
    volumes: [./models:/app/models:ro, ./site:/site:ro]
    depends_on: { postgres: { condition: service_healthy }, model-server: { condition: service_healthy }, stt-server: { condition: service_healthy } }

  router:                         # pages ask it which worker takes a call
    image: agmc/voice:${VOICE_TAG:?set VOICE_TAG to the release tag of the voice image}
    environment: { STATE_URL: postgresql://postgres:change-me@postgres:5432/agmc }
    command: ["python", "-m", "dealer_core.gateway", "--host", "0.0.0.0", "--port", "8760", "--origin", "https://www.agmc.ae"]
    ports: ["8760:8760"]
    depends_on: { postgres: { condition: service_healthy } }

  prometheus:                     # collects /metrics from every worker
    image: prom/prometheus:v3.15.0
    volumes: [./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro]
    ports: ["9090:9090"]

volumes: { pgdata: {}, hf: {} }
