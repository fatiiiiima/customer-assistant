- {at: haggled, say: "Is that your final price?", expect: {tool: get_car, car: X5, reply_has_all: ["209,000", Q7, Macan]}}
- {at: haggled, say: "Can you do 150k?", expect: {tool: get_car, car: X5, reply_has_all: ["209,000", Q7, Macan]}}
- {at: haggled, say: "Can you do 120,000?", expect: {tool: get_car, car: X5, reply_has_all: ["209,000", RX 350]}}
- {at: haggled, say: "Is that a good price?", expect: {tool: get_car, car: X5, reply_has: ["209,000"], reply_lacks: [Q7, Macan]}}

