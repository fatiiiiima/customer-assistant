- {at: price_q, say: "Any discount?", expect: {tool: get_car, car: X5, reply_has: ["209,000"], reply_lacks: [Q7, Macan, Wrangler, Patrol, Land Cruiser]}}
- {at: price_q, say: "Is the price negotiable?", expect: {tool: get_car, car: X5, reply_has: ["209,000"], reply_lacks: [Q7, Macan, Wrangler, Patrol, Land Cruiser]}}
