- {at: car, say: "can I see the photos?", expect: {not_tool: prepare_booking}}
- {at: car, say: "maybe later", expect: {not_tool: prepare_booking}}
- {at: car, say: "book it and is the price negotiable?", expect: {tool: prepare_booking}}

